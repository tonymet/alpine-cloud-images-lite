# vim: ts=2 et:

# Declarative HCL dimension overlay for alpine-lite
# Integrates directly into upstream alpine-cloud-images via --custom overlays/alpine-lite

include required("alpine.conf")

Dimensions {
  bootstrap {
    lite {
      name           = [ lite ]
      bootstrap_name = Alpine Lite Cloud

      packages {
        # Cloud init lightweight bootstrap
        tiny-cloud = true

        # Exclude heavy multi-process daemons
        dhcpcd                       = false
        dhcpcd-openrc                = false
        openssh                      = false
        openssh-server               = false
        openssh-client-default       = false
        openssh-client-common        = false
        chrony                       = false
        chrony-openrc                = false
        chrony-common                = false
        acpid                        = false
        acpid-openrc                 = false

        # Include lightweight replacements
        dropbear                     = true
        dropbear-openrc              = true
        zram-init                    = true
        zram-init-openrc             = true
        sfdisk                       = true
        e2fsprogs-extra              = true
      }

      services {
        boot {
          zram-init = true
          acpid     = null
        }
        default {
          chronyd  = null
          ntpd     = true
          sshd     = null
          dropbear = true
        }
      }

      kernel_modules {
        usb-storage = false
      }

      bootloader_timeout = 1

      scripts = [ setup-lite ]
    }
  }
}
